  <link rel="stylesheet" href="css/sw.css?v=48">

<body class="aufgabe mit-tuer">
  <div class="grund" aria-hidden="true"></div>
  <main class="aufgabe-seite">
    <header class="aufgabe-kopf">
      <a class="knopf leise-knopf knopf--klein" id="zurueck-link" href="index.html">← Start</a>
      <h1>Spiegeln</h1>
      <p class="aufgabe-auftrag" id="auftrag">Ergänze spiegelbildlich.</p>
    </header>
    <!-- Auswahl: erscheint ohne Stufe und ohne Aufgabe in der Adresse (js/spiegeln-auswahl.js) -->
    <div class="tangram-auswahl" id="auswahl" hidden></div>

    <div class="spiegel-buehne" id="buehne">
      <div class="malrahmen" id="malrahmen">
        <!-- Kästchen sind echte Knöpfe (Tastatur: Pfeile, Leertaste). Die Achse liegt als Zeichnung darüber. -->
        <div class="malraster" id="malraster" role="grid" aria-label="Kästchenraster" aria-describedby="mal-hilfe"></div>
        <svg class="malraster__achsen" id="achsen" aria-hidden="true" focusable="false"></svg>
      </div>
      <!-- Rückmeldung von Stella direkt unter der Fläche (Etappe 6b) -->
      <div class="rueckmeldung" id="rueckmeldung"><img src="bilder/stella-64.png?b=1" alt="" width="64" height="64"><p id="hinweis"></p></div>
      <div class="werkzeuge" role="toolbar" aria-label="Werkzeuge">
        <div class="farbwahl" id="farbwahl" role="radiogroup" aria-label="Farbe"></div>
        <div class="vorlage" id="vorlage" hidden></div>
        <div class="antworten" id="antworten" role="radiogroup" aria-label="Welche Figur entsteht?" hidden></div>
        <button type="button" class="werkzeug werkzeug--leise" data-aktion="zurueck" aria-label="Rückgängig">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>rückgängig</span>
        </button>
        <button type="button" class="werkzeug werkzeug--leise werkzeug--keine" data-aktion="keine" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M6.5 17.5 17.5 6.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <span>keine Achse</span>
        </button>
        <button type="button" class="werkzeug werkzeug--spiegel" data-aktion="spiegel" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9" y="3" width="6" height="18" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 7l2 2M11 11l2 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Spiegel</span>
        </button>
        <button type="button" class="werkzeug werkzeug--fertig" data-aktion="fertig">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12.5 10 17 19 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Fertig?</span>
        </button>
      </div>
      <div class="erfolg erfolg--spiegel" id="erfolg" hidden>
        <picture><source srcset="bilder/stella.webp?b=1" type="image/webp"><img src="bilder/stella.png?b=1" alt="" width="640" height="640"></picture>
        <p class="erfolg__gross">Richtig gespiegelt!</p>
        <p class="erfolg__stempel" id="erfolg-stempel" hidden></p>
        <div class="erfolg__knoepfe">
          <a class="knopf haupt knopf--klein" id="weiter" href="spiegeln.html">Nächste Aufgabe</a>
          <a class="knopf leise-knopf knopf--klein" id="zur-auswahl" href="spiegeln.html" hidden>Zur Auswahl</a>
        </div>
      </div>
    </div>
    <p class="nurvorlesen" id="mal-hilfe"></p>
  </main>
  <div id="live" class="nurvorlesen" aria-live="polite" aria-atomic="true"></div>
  <footer class="fuss"><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a></footer>

  <script src="js/speicher.js?v=48"></script>
  <script src="js/tuer.js?v=48" data-skripte="js/geometrie.js?v=48 js/motive.js?v=48 js/spiegeln-raster.js?v=48 js/spiegeln-aufgaben.js?v=48 js/spiegeln-malen.js?v=48 js/spiegeln-achsen.js?v=48 js/spiegeln-falt.js?v=48 js/spiegeln-auswahl.js?v=48 js/spiegeln.js?v=48"></script>

</body>
