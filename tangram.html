<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0e2f45">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
  <title>Tangram – Seesternwerkstatt</title>
  <link rel="icon" href="bilder/stella-64.png?b=1">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="bilder/app-180.png?b=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Seesternwerkstatt">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="schriften/schriften.css?v=45">
  <link rel="stylesheet" href="css/tokens.css?v=45">
  <link rel="stylesheet" href="css/sw.css?v=45">
</head>
<body class="aufgabe">
  <div class="grund" aria-hidden="true"></div>
  <main class="aufgabe-seite">
    <header class="aufgabe-kopf">
      <a class="knopf leise-knopf knopf--klein" id="zurueck" href="index.html">← Start</a>
      <h1>Tangram</h1>
      <p class="aufgabe-auftrag" id="auftrag">Wähle eine Figur.</p>
    </header>

    <!-- Auswahl: erscheint ohne ?figur= in der Adresse (js/tangram-auswahl.js) -->
    <div class="tangram-auswahl" id="auswahl" hidden></div>

    <!-- Spiel: erscheint mit ?figur=…&stufe=… (js/tangram.js) -->
    <div class="tangram-buehne" id="spiel" hidden>
      <!-- Der Rahmen gibt die Größe vor. Die Spielfläche enthält nur die Zeichnung (randlos, zum Ziehen).
           Die Erfolgskarte liegt als eigenes Element darüber, mit Abstand zum Rand. -->
      <div class="spielrahmen" id="spielrahmen">
        <div class="spielflaeche" id="spielflaeche">
          <svg id="tangram" role="group" aria-label="Spielfläche mit sieben Tangram-Teilen" focusable="false"></svg>
        </div>
        <!-- Erscheint in der leeren Ablage, wenn alle Teile liegen. Die Fläche verschiebt sich dabei nicht. -->
        <div class="erfolg" id="erfolg" hidden>
          <picture><source srcset="bilder/stella.webp?b=1" type="image/webp"><img src="bilder/stella.png?b=1" alt="" width="640" height="640"></picture>
          <p class="erfolg__gross">Geschafft!</p>
          <p class="erfolg__satz">Alle sieben Teile passen.</p>
          <p class="erfolg__stempel" id="erfolg-stempel" hidden></p>
          <div class="erfolg__knoepfe">
            <a class="knopf haupt knopf--klein" href="tangram.html" id="weiter">Nächste Figur</a>
            <button type="button" class="knopf leise-knopf knopf--klein" data-aktion="mischen">Noch einmal</button>
          </div>
        </div>
      </div>
      <!-- Rückmeldung von Stella direkt unter der Fläche (Etappe 6b) -->
      <div class="rueckmeldung" id="rueckmeldung"><img src="bilder/stella-64.png?b=1" alt="" width="64" height="64"><p id="hinweis"></p></div>
      <div class="werkzeuge" role="toolbar" aria-label="Werkzeuge" aria-controls="tangram">
        <button type="button" class="werkzeug" data-aktion="links" aria-label="Nach links drehen" aria-keyshortcuts="L">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5H3v5M3.6 10A9 9 0 1 1 6 16.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>links drehen</span>
        </button>
        <button type="button" class="werkzeug" data-aktion="rechts" aria-label="Nach rechts drehen" aria-keyshortcuts="R">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M16 5h5v5M20.4 10A9 9 0 1 0 18 16.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>rechts drehen</span>
        </button>
        <button type="button" class="werkzeug" data-aktion="wenden" aria-label="Wenden" aria-keyshortcuts="W">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v18" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2.5 2" stroke-linecap="round"/><path d="M9 7 3 17h6zM15 7l6 10h-6z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
          <span>wenden</span>
        </button>
        <button type="button" class="werkzeug werkzeug--tipp" data-aktion="tipp" aria-label="Tipp von Stella" aria-describedby="hinweis">
          <img src="bilder/stella-64.png?b=1" alt="" width="64" height="64">
          <span>Tipp</span>
        </button>
        <button type="button" class="werkzeug werkzeug--leise" data-aktion="mischen" aria-label="Teile neu mischen">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>mischen</span>
        </button>
      </div>
    </div>
    <p class="nurvorlesen" id="tastatur-hilfe">Mit der Tabulatortaste wählst du ein Teil. Pfeiltasten verschieben es, mit Umschalttaste weiter. L dreht nach links, R nach rechts, W wendet.</p>
  </main>
  <div id="live" class="nurvorlesen" aria-live="polite" aria-atomic="true"></div>
  <footer class="fuss"><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a></footer>
  <script src="js/config.js?v=45"></script>
  <script src="js/geometrie.js?v=45"></script>
  <script src="js/tangram-teile.js?v=45"></script>
  <script src="js/tangram-logik.js?v=45"></script>
  <script src="js/tangram-figuren.js?v=45"></script>
  <script src="js/speicher.js?v=45"></script>
  <script src="js/motive.js?v=45"></script>
  <script src="js/tangram-auswahl.js?v=45"></script>
  <script src="js/tangram.js?v=45"></script>
</body>
</html>
